<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>demo</title>
    <style>
      :root {
  --mono:
    ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}


@media (max-width: 720px) {
  main {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
  }
}

/* ---------- Console feed ---------- */
.cf {
  color-scheme: light dark;
  --bg: #171b24;
  --bar: #1e2330;
  --line: #2b3244;
  --fg: #d8dee9;
  --dim: #7d889e;
  --str: #e9b27a;
  --num: #8fb8ff;
  --bool: #c79bff;
  --nul: #8b93a5;
  --key: #7fd1c2;
  --warn-bg: #2e2813;
  --warn-fg: #f0d27a;
  --err-bg: #331a1d;
  --err-fg: #ff9b9b;
  --hover: #202637;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--bg);
  color: var(--fg);
  font: 12.5px/1.55 var(--mono);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}
@media (prefers-color-scheme: dark) {
  .cf {
    --bg: #fbfbfd;
    --bar: #f0f2f6;
    --line: #dfe3ea;
    --fg: #252b37;
    --dim: #7a8396;
    --str: #b4531c;
    --num: #1d5fd1;
    --bool: #7a3fc4;
    --nul: #7a8396;
    --key: #0b7a6c;
    --warn-bg: #fff6da;
    --warn-fg: #7a5a00;
    --err-bg: #ffeceb;
    --err-fg: #b3261e;
    --hover: #f3f5f9;
  }
}

.cf-body {
  flex: 1;
  overflow: auto;
  min-height: 0;
}
.cf-empty {
  padding: 18px 12px;
  color: var(--dim);
}
.cf-row {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 2px 10px 2px calc(10px + var(--d, 0) * 16px);
  border-bottom: 1px solid var(--line);
}
.cf-row:hover {
  background: var(--hover);
}
.cf-row.warn {
  background: var(--warn-bg);
  color: var(--warn-fg);
}
.cf-row.error {
  background: var(--err-bg);
  color: var(--err-fg);
}
.cf-row.group .cf-msg {
  font-weight: 650;
}
.cf-row.command .cf-msg::before,
.cf-row.result .cf-msg::before {
  color: var(--dim);
  margin-right: 0.6em;
}
.cf-row.command .cf-msg::before {
  content: "\203A";
}
.cf-row.result .cf-msg::before {
  content: "\2190";
}
.cf-badge {
  background: var(--dim);
  color: var(--bg);
  border-radius: 9px;
  padding: 0 6px;
  font-size: 11px;
  line-height: 17px;
  margin-top: 2px;
}
.cf-time {
  color: var(--dim);
  font-size: 11px;
  margin-top: 1px;
  flex: none;
}
.cf-msg {
  flex: 1;
  min-width: 0;
  white-space: pre-wrap;
  word-break: break-word;
}
.cf-msg > * {
  margin-right: 0.7em;
}
.cf-str {
  color: var(--str);
}
.cf-num {
  color: var(--num);
}
.cf-bool {
  color: var(--bool);
}
.cf-nul {
  color: var(--nul);
}
.cf-fn {
  color: var(--key);
  font-style: italic;
}
.cf-k {
  color: var(--key);
}
.cf-node {
  display: inline-block;
  vertical-align: top;
  max-width: 100%;
}
.cf-t {
  cursor: pointer;
}
.cf-t::before {
  content: "\25B8";
  display: inline-block;
  width: 1em;
  color: var(--dim);
  transition: transform 0.12s;
}
.cf-t.open::before {
  transform: rotate(90deg);
}
.cf-kids {
  margin-left: 0.5em;
  padding-left: 0.8em;
  border-left: 1px solid var(--line);
}
.cf-kids > * {
  display: block;
}
.cf-err {
  display: block;
}
.cf-table {
  border-collapse: collapse;
  margin: 3px 0;
}
.cf-table th,
.cf-table td {
  border: 1px solid var(--line);
  padding: 1px 10px;
  text-align: left;
}
.cf-table th {
  background: var(--bar);
  font-weight: 600;
}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- <script type="module" src="/src/console.js"></script> -->
  </body>
</html>
