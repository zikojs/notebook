name: Publish Notebook

on:
  push:
    tags:
      - "notebook-v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag"
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - beta

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: zikojs/workflow@v1
        with:
          tag-prefix: notebook-v
          npm-token: ${{ secrets.NPM_TOKEN }}
          dist-tag: ${{ inputs.tag || 'latest' }}