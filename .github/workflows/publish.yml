name: Publish Notebook packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag"
        required: true
        default: latest
        type: choice
        options: [latest, next, beta]
  push:
    tags:
      - "notebook-v*"

permissions:
  contents: read

concurrency:
  group: publish-notebook
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: zikojs/workflow@v1
        with:
          tag-prefix: notebook-v
          dist-tag: ${{ inputs.tag }}   # empty on tag push, so auto-detected
          npm-token: ${{ secrets.NPM_TOKEN }}