name: Publish Notebook
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag"
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - beta
  push:
    tags:
      - "notebook-v*"
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        uses: zikojs/workflow@v1
        with:
          tag-prefix: notebook-v
          packages-directory: packages
          build-filter: "./packages/**"
          dist-tag: ${{ inputs.tag || 'latest' }}
          npm-token: ${{ secrets.NPM_TOKEN }}
