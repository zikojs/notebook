name: Publish Notebook

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag"
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - beta

  push:
    tags:
      - "notebook-v*"

concurrency:
  group: publish-notebook
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Run Publish Action
        uses: zikojs/workflow@main # Replace with your repo and tag/branch (e.g. @v1)
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
          tag-prefix: "notebook-v"
          default-dist-tag: ${{ inputs.tag }}